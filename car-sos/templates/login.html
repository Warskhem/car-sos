{% extends "base.html" %}
{% block title %}Login - Car SOS{% endblock %}
{% block content %}
<div class="form-container">
    <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:2rem;margin-bottom:4px;">🚗</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account</p>
    </div>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required class="form-input" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required class="form-input" placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <p class="form-footer">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    <p class="form-footer"><a href="{{ url_for('admin_login') }}">Admin access</a></p>
</div>
{% endblock %}
